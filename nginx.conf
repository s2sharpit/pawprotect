events {
    worker_connections 1024;
}

http {
    # Define rate limiting zone: 10MB memory, 5 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    
    # Return standard HTTP 429 (Too Many Requests) instead of default 503
    limit_req_status 429;

    # HTTP redirect to HTTPS and Let's Encrypt validation
    server {
        listen 80;
        server_name pawprotect.s2sharpit.dev;
        server_tokens off;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name pawprotect.s2sharpit.dev;
        server_tokens off;

        ssl_certificate /etc/letsencrypt/live/pawprotect.s2sharpit.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pawprotect.s2sharpit.dev/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location /api/ {
            # Apply rate limit: allow burst of 10 requests instantly without delay
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
