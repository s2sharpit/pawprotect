spring.application.name=petGuard
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_SCHEMA:pawprotect}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# spring.jackson.serialization.write-dates-as-timestamps=false
# spring.jackson.time-zone=UTC

# JWT settings
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ai
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.timeout=${AI_SERVICE_TIMEOUT:120000} # 2 minutes
ai.api.key=${AI_API_KEY}

# CORS
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# Admin Credentials
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}