services:
  mysqldb:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_SCHEMA}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  app:
    build: ./backend
    restart: unless-stopped
    environment:
      - DB_HOST=mysqldb
      - DB_PORT=3306
      - DB_SCHEMA=${DB_SCHEMA}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - AI_API_KEY=${AI_API_KEY}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      mysqldb:
        condition: service_healthy
      ai:
        condition: service_healthy
  ai:
    build: ./petguard-ai
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_SECRET_KEY=${AI_API_KEY}
      - GEMINI_MODEL=${AI_MODEL_NAME}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/api/v1/ai/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./petguard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - app

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      app:
        condition: service_started
      ai:
        condition: service_healthy

volumes:
  mysql-data:
