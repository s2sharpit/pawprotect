name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd ~/pawprotect
            git pull origin main
            
            # Create .env file from secrets
            echo "ROOT_PASSWORD=${{ secrets.ROOT_PASSWORD }}" > .env
            echo "DB_SCHEMA=${{ secrets.DB_SCHEMA }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            echo "AI_API_KEY=${{ secrets.AI_API_KEY }}" >> .env
            echo "AI_SERVICE_URL=${{ secrets.AI_SERVICE_URL }}" >> .env
            echo "AI_MODEL_NAME=${{ secrets.AI_MODEL_NAME }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            
            # Rebuild and restart containers
            docker compose down
            docker compose up -d --build
