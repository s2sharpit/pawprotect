name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          docker compose build
          docker compose push

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          script: |
            cd ~/pawprotect
            git pull origin main
            
            # Create .env file from secrets
            echo "ROOT_PASSWORD=${{ secrets.ROOT_PASSWORD }}" > .env
            echo "DB_SCHEMA=${{ secrets.DB_SCHEMA }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            echo "AI_API_KEY=${{ secrets.AI_API_KEY }}" >> .env
            echo "AI_SERVICE_URL=${{ secrets.AI_SERVICE_URL }}" >> .env
            echo "AI_MODEL_NAME=${{ secrets.AI_MODEL_NAME }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> .env
            echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
            echo "APP_FRONTEND_URL=${{ secrets.APP_FRONTEND_URL }}" >> .env
            
            # Login to GHCR to pull images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull pre-built images and restart without rebuilding
            docker compose pull
            docker compose up -d
            
            # Clean up old images to save space
            docker image prune -af
